# /etc/nginx/sites-available/truck.qutrit.org  (on the reverse-proxy box)
# ln -s ../sites-available/truck.qutrit.org /etc/nginx/sites-enabled/
# certbot --nginx -d truck.qutrit.org   (or point ssl_certificate at your existing wildcard cert)

upstream paddy2026 {
    server 10.0.0.4:8010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name truck.qutrit.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name truck.qutrit.org;

    ssl_certificate     /etc/letsencrypt/live/truck.qutrit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/truck.qutrit.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Google sign-in popup needs this to talk back to the page
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://paddy2026;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change — cache hard
    location /assets/ {
        proxy_pass http://paddy2026;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
