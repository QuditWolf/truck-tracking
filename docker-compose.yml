services:
  app:
    build: .
    image: paddy2026
    container_name: paddy2026
    restart: unless-stopped
    env_file: .env
    environment:
      PADDY_DB: /data/paddy.db
      FORWARDED_ALLOW_IPS: 10.0.0.0/24  # VPN; nginx proxy lives here
    volumes:
      - ./data:/data
    # Bind to the VPN interface only; nginx on the proxy box reaches it over the VPN.
    ports:
      - "10.0.0.4:8010:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
